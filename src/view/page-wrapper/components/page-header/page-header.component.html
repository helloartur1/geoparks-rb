<header class="page-header">
    <a class="page-header__link" (click)="moveToMainPage()">
        <img src="../../../../assets/img/mountain-svgrepo-com.png" alt="Лога геопарка">
        <h1 class="page-header__title">Геопарки республики Башкортостан</h1>
    </a>
    <div class="auth-banner" *ngIf="showBanner()">
        <ng-container *ngIf="authData; else loginButton">
             <button mat-button [matMenuTriggerFor]="userMenu" class="auth-banner__username-button"> {{ authData.userName }} </button>

      <!-- Меню пользователя -->
            <mat-menu #userMenu="matMenu" class="menu">
                <button *ngIf="isAdmin" mat-menu-item (click)="goToStats()" class="gotost">Статистика</button>
            </mat-menu>

            <button class="logout-button" mat-icon-button (click)="logout()">
                <mat-icon>input icon</mat-icon>
            </button>
        </ng-container>
    </div>
    <ng-template #loginButton>
        <button mat-button class="login-button" (click)="moveToLoginPage()">Войти</button>
    </ng-template>
</header>
